<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EQUILUX">
  <!--
    Das Zeichen: eine Raute, aus der zwei Schlitze parallel zu den rechten
    Kanten geschnitten sind — daraus entstehen drei nach rechts zeigende Arme,
    also ein um 45° gedrehtes „E". Als Körper mit Tiefe: die Seitenflächen sind
    aus der Kontur extrudiert (Richtung 13|21) und nach Lichteinfall von oben
    links schattiert; die Frontfläche trägt die zwei Facetten der Vorlage.
  -->
  <defs>
    <linearGradient id="eqTop" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6ae4ff"/><stop offset="1" stop-color="#37bdfa"/>
    </linearGradient>
    <linearGradient id="eqBottom" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1a9cfe"/><stop offset="1" stop-color="#0b64ef"/>
    </linearGradient>
    <linearGradient id="eqGround" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0a2352"/><stop offset="1" stop-color="#03102e"/>
    </linearGradient>
    <radialGradient id="eqGlow" cx="0.40" cy="0.34" r="1.0">
      <stop offset="0" stop-color="#3f8ce8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2f7bd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="eqContact" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="eqShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="eqFront"><path d="M256.0 91.0 L363.3 198.3 L327.0 234.6 L256.0 163.6 L256.0 206.5 L305.5 256.0 L256.0 305.5 L256.0 343.5 L327.0 272.5 L365.7 311.3 L256.0 421.0 L91.0 256.0 Z"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#eqGround)"/>
  <rect width="512" height="512" rx="112" fill="url(#eqGlow)"/>

  <g transform="translate(-6.5,-10.5)">
    <!-- Schlagschatten auf der Kachel -->
    <path d="M256.0 91.0 L363.3 198.3 L327.0 234.6 L256.0 163.6 L256.0 206.5 L305.5 256.0 L256.0 305.5 L256.0 343.5 L327.0 272.5 L365.7 311.3 L256.0 421.0 L91.0 256.0 Z" transform="translate(34,55)" fill="#000610" opacity="0.55" filter="url(#eqShadow)"/>
    <path d="M256.0 91.0 L363.3 198.3 L327.0 234.6 L256.0 163.6 L256.0 206.5 L305.5 256.0 L256.0 305.5 L256.0 343.5 L327.0 272.5 L365.7 311.3 L256.0 421.0 L91.0 256.0 Z" transform="translate(16,26)" fill="#000610" opacity="0.45" filter="url(#eqContact)"/>

    <!-- Seitenflächen der Extrusion -->
    <g>
      <polygon points="256.0,91.0 363.3,198.3 376.3,219.3 269.0,112.0" fill="#144994"/>
      <polygon points="363.3,198.3 327.0,234.6 340.0,255.6 376.3,219.3" fill="#0e3b83"/>
      <polygon points="327.0,234.6 256.0,163.6 269.0,184.6 340.0,255.6" fill="#0e3b83"/>
      <polygon points="256.0,163.6 256.0,206.5 269.0,227.5 269.0,184.6" fill="#0e3b83"/>
      <polygon points="256.0,206.5 305.5,256.0 318.5,277.0 269.0,227.5" fill="#144994"/>
      <polygon points="305.5,256.0 256.0,305.5 269.0,326.5 318.5,277.0" fill="#0e3b83"/>
      <polygon points="256.0,305.5 256.0,343.5 269.0,364.5 269.0,326.5" fill="#0e3b83"/>
      <polygon points="256.0,343.5 327.0,272.5 340.0,293.5 269.0,364.5" fill="#3795f1"/>
      <polygon points="327.0,272.5 365.7,311.3 378.7,332.3 340.0,293.5" fill="#144994"/>
      <polygon points="365.7,311.3 256.0,421.0 269.0,442.0 378.7,332.3" fill="#0e3b83"/>
      <polygon points="256.0,421.0 91.0,256.0 104.0,277.0 269.0,442.0" fill="#0e3b83"/>
      <polygon points="91.0,256.0 256.0,91.0 269.0,112.0 104.0,277.0" fill="#3795f1"/>
    </g>

    <!-- Frontfläche mit den zwei Facetten -->
    <g clip-path="url(#eqFront)">
      <rect x="0" y="0" width="512" height="256" fill="url(#eqTop)"/>
      <rect x="0" y="256" width="512" height="256" fill="url(#eqBottom)"/>
      <!-- Glanzkante nur dort, wo die Kante zum Licht zeigt -->
      <path d="M256.0 343.5 L327.0 272.5 M91.0 256.0 L256.0 91.0" fill="none" stroke="#dff6ff" stroke-opacity="0.7" stroke-width="6" stroke-linecap="square"/>
    </g>
  </g>
</svg>
