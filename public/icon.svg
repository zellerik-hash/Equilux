<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EQUILUX">
  <!--
    Das Zeichen: eine Raute, aus der zwei Schlitze parallel zu den rechten
    Kanten geschnitten sind — daraus entstehen drei nach rechts zeigende Arme,
    also ein um 45° gedrehtes „E".

    Die Tiefe ist gerechnet, nicht gemalt: aus jeder Konturkante entsteht eine
    Seitenflaeche (Extrusion 15|24), deren Helligkeit aus dem Skalarprodukt
    ihrer Aussennormalen mit der Lichtrichtung folgt. Auf der Frontflaeche
    liegt dieselbe Rechnung als Fase — hell, wo die Kante zum Licht zeigt,
    dunkel, wo sie wegzeigt. Dazu ein Kontakt- und ein Schlagschatten.
  -->
  <defs>
    <linearGradient id="eqTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6ae4ff"/><stop offset="1" stop-color="#37bdfa"/>
    </linearGradient>
    <linearGradient id="eqBottom" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#1a97fd"/><stop offset="1" stop-color="#0b64ef"/>
    </linearGradient>
    <radialGradient id="eqLift" cx="0.40" cy="0.33" r="0.95">
      <stop offset="0" stop-color="#2e6fc8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2e6fc8" stop-opacity="0"/>
    </radialGradient>
    <filter id="eqContact" x="-25%" y="-25%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="eqCast" x="-40%" y="-40%" width="190%" height="200%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="eqFront"><path d="M256.0 91.0 L363.3 198.3 L327.0 234.6 L256.0 163.6 L256.0 206.5 L305.5 256.0 L256.0 305.5 L256.0 343.5 L327.0 272.5 L365.7 311.3 L256.0 421.0 L91.0 256.0 Z"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#04163d"/>
  <rect width="512" height="512" rx="112" fill="url(#eqLift)"/>

  <g transform="translate(10.0,-12.0)">
    <path d="M256.0 91.0 L363.3 198.3 L327.0 234.6 L256.0 163.6 L256.0 206.5 L305.5 256.0 L256.0 305.5 L256.0 343.5 L327.0 272.5 L365.7 311.3 L256.0 421.0 L91.0 256.0 Z" transform="translate(45,72)" fill="#000409" opacity="0.55" filter="url(#eqCast)"/>
    <path d="M256.0 91.0 L363.3 198.3 L327.0 234.6 L256.0 163.6 L256.0 206.5 L305.5 256.0 L256.0 305.5 L256.0 343.5 L327.0 272.5 L365.7 311.3 L256.0 421.0 L91.0 256.0 Z" transform="translate(18,29)" fill="#000409" opacity="0.5" filter="url(#eqContact)"/>

    <g>
      <polygon points="256.0,91.0 363.3,198.3 378.3,222.3 271.0,115.0" fill="#16458b"/>
      <polygon points="363.3,198.3 327.0,234.6 342.0,258.6 378.3,222.3" fill="#0d3375"/>
      <polygon points="327.0,234.6 256.0,163.6 271.0,187.6 342.0,258.6" fill="#0d3375"/>
      <polygon points="256.0,163.6 256.0,206.5 271.0,230.5 271.0,187.6" fill="#0d3375"/>
      <polygon points="256.0,206.5 305.5,256.0 320.5,280.0 271.0,230.5" fill="#16458b"/>
      <polygon points="305.5,256.0 256.0,305.5 271.0,329.5 320.5,280.0" fill="#0d3375"/>
      <polygon points="256.0,305.5 256.0,343.5 271.0,367.5 271.0,329.5" fill="#0d3375"/>
      <polygon points="256.0,343.5 327.0,272.5 342.0,296.5 271.0,367.5" fill="#3d9af4"/>
      <polygon points="327.0,272.5 365.7,311.3 380.7,335.3 342.0,296.5" fill="#15458b"/>
      <polygon points="365.7,311.3 256.0,421.0 271.0,445.0 380.7,335.3" fill="#0d3375"/>
      <polygon points="256.0,421.0 91.0,256.0 106.0,280.0 271.0,445.0" fill="#0d3375"/>
      <polygon points="91.0,256.0 256.0,91.0 271.0,115.0 106.0,280.0" fill="#3d9af4"/>
    </g>

    <g clip-path="url(#eqFront)">
      <rect x="0" y="0" width="512" height="256" fill="url(#eqTop)"/>
      <rect x="0" y="256" width="512" height="256" fill="url(#eqBottom)"/>
      <!-- Kante der Faltung auf der Mittellinie -->
      <rect x="0" y="253.5" width="512" height="2.5" fill="#ffffff" fill-opacity="0.28"/>
        <polygon points="256.0,91.0 363.3,198.3 360.1,201.5 252.8,94.2" fill="#ffffff" fill-opacity="0.10"/>
        <polygon points="363.3,198.3 327.0,234.6 323.8,231.4 360.1,195.1" fill="#03123a" fill-opacity="0.44"/>
        <polygon points="327.0,234.6 256.0,163.6 259.2,160.4 330.2,231.4" fill="#03123a" fill-opacity="0.08"/>
        <polygon points="256.0,163.6 256.0,206.5 251.5,206.5 251.5,163.6" fill="#03123a" fill-opacity="0.26"/>
        <polygon points="256.0,206.5 305.5,256.0 302.3,259.2 252.8,209.7" fill="#ffffff" fill-opacity="0.10"/>
        <polygon points="305.5,256.0 256.0,305.5 252.8,302.3 302.3,252.8" fill="#03123a" fill-opacity="0.44"/>
        <polygon points="256.0,305.5 256.0,343.5 251.5,343.5 251.5,305.5" fill="#03123a" fill-opacity="0.26"/>
        <polygon points="256.0,343.5 327.0,272.5 330.2,275.7 259.2,346.7" fill="#ffffff" fill-opacity="0.54"/>
        <polygon points="327.0,272.5 365.7,311.3 362.5,314.5 323.8,275.7" fill="#ffffff" fill-opacity="0.09"/>
        <polygon points="365.7,311.3 256.0,421.0 252.8,417.8 362.5,308.1" fill="#03123a" fill-opacity="0.44"/>
        <polygon points="256.0,421.0 91.0,256.0 94.2,252.8 259.2,417.8" fill="#03123a" fill-opacity="0.08"/>
        <polygon points="91.0,256.0 256.0,91.0 259.2,94.2 94.2,259.2" fill="#ffffff" fill-opacity="0.54"/>
    </g>
  </g>
</svg>
