<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EQUILUX">
  <!--
    Das Zeichen: eine Raute, aus der zwei Schlitze parallel zu den rechten
    Kanten geschnitten sind — daraus entstehen drei nach rechts zeigende Arme,
    also ein um 45° gedrehtes „E". Zwei Facetten (oben hell, unten kräftiger)
    geben die Faltung. Maße aus der Vorlage abgenommen: Radius 165 um (256|256).
  -->
  <defs>
    <linearGradient id="eqTop" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#55dcff"/>
      <stop offset="1" stop-color="#3cc2fb"/>
    </linearGradient>
    <linearGradient id="eqBottom" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1596fd"/>
      <stop offset="1" stop-color="#0a6ff4"/>
    </linearGradient>
    <clipPath id="eqMark">
      <path d="M256 91
               L363.3 198.3 L327 234.6 L256 163.6
               L256 206.5 L305.5 256
               L256 305.5 L256 343.5 L327 272.5 L365.7 311.3
               L256 421 L91 256 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#04163d"/>
  <g clip-path="url(#eqMark)">
    <rect x="0" y="0" width="512" height="256" fill="url(#eqTop)"/>
    <rect x="0" y="256" width="512" height="256" fill="url(#eqBottom)"/>
  </g>
</svg>
